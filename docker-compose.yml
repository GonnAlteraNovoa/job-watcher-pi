services:
  job-watcher-pi:
    build: .
    container_name: job-watcher-pi
    restart: unless-stopped
    environment:
      CONFIG_PATH: /data/sources.yml
      DATABASE_PATH: /data/jobs.db
    ports:
      - "8088:8088"
    volumes:
      - ${JOB_WATCHER_DATA_PATH:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
